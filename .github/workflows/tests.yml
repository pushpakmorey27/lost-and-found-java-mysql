name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Java 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check core behavior on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: test.cmd
      - name: Check core behavior on Linux
        if: runner.os == 'Linux'
        run: bash test.sh

  mysql:
    name: MySQL 8.4 transactions and rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          # This credential belongs only to this temporary CI container.
          MYSQL_ROOT_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Check JDBC, schema, rules and transaction rollback
        env:
          LF_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/
          LF_TEST_MYSQL_USER: root
          LF_TEST_MYSQL_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash test.sh --mysql --reset-test-database
